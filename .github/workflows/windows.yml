name: Windows build, install and run

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit of littlebirdtrading-app
        default: main

permissions:
  contents: read
  id-token: write     # OIDC for Azure Trusted Signing (same account as the other apps); no stored credential

jobs:
  windows:
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - name: Check out the private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: none298-dotcom/littlebirdtrading-app
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ci
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the website installers (with self-update)
        working-directory: android
        shell: bash
        run: |
          ./gradlew --no-daemon :desktop:packageMsi :desktop:packageExe -Pdistribution=direct
          mkdir -p ../dist/direct && cp desktop/build/compose/binaries/main/msi/*.msi desktop/build/compose/binaries/main/exe/*.exe ../dist/direct/
      - name: Build the Microsoft Store installer (no self-update)
        working-directory: android
        shell: bash
        run: |
          ./gradlew --no-daemon :desktop:packageExe -Pdistribution=store
          mkdir -p ../dist/store && cp desktop/build/compose/binaries/main/exe/*.exe ../dist/store/
      # azure/login MUST run before the signing action (it authenticates via DefaultAzureCredential).
      - name: Azure login (federated, OIDC)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the installers (Azure Trusted Signing, Little Bird Trading LLC)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: mlcsigning
          certificate-profile-name: mlc-public-trust
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify every installer is validly signed
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem dist -Recurse -Include *.exe,*.msi) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ("${{ env.AZURE_CLIENT_ID }}" -ne "" -and $sig.Status -ne "Valid") { Write-Host "::error::$($f.Name) is not validly signed"; exit 1 }
          }
      - name: Install the MSI, run it and photograph each screen
        shell: pwsh
        run: |
          Start-Process python -ArgumentList "ci/mock/server.py","ci/mock/markets.json" -WindowStyle Hidden
          Start-Sleep 3
          $msi = Get-ChildItem dist/direct/*.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 50; throw "install failed $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Filter "Little Bird Trading.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "installed app not found" }
          Write-Host "installed at $($exe.FullName)"
          $data = "$env:APPDATA\Little Bird Trading"; New-Item -ItemType Directory -Force $data | Out-Null
          '{"welcomeDone":true,"favorites":["US","JP"]}' | Out-File -Encoding ascii "$data\settings.json"
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          foreach ($tab in "home","markets","alerts","account") {
            $env:JAVA_TOOL_OPTIONS = "-Dlbt.api=http://127.0.0.1:8787/api/app -Dlbt.tab=$tab"
            $app = Start-Process $exe.FullName -PassThru
            Start-Sleep 25
            if ($app.HasExited) { throw "the app quit on $tab (exit $($app.ExitCode))" }
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots/$tab.png"); Stop-Process -Id $app.Id -Force; Start-Sleep 2
          }
          Get-ChildItem dist -Recurse -File | ForEach-Object { "{0} {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } | Tee-Object dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows
          path: |
            dist/
            shots/
            install.log
