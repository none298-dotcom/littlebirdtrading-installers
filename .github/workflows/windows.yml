name: Windows build, install and run

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit of littlebirdtrading-app
        default: main
      store_images:
        description: Capture native Windows store images only (no installer publication)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write     # OIDC for Azure Trusted Signing (same account as the other apps); no stored credential

jobs:
  windows:
    if: ${{ inputs.store_images != true }}
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - name: Check out the private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: none298-dotcom/littlebirdtrading-app
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ci
      - name: Validate synthetic two-list fixture
        run: python -m unittest discover -s ci/mock -p test_server.py
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      # Windows voice (owner Oct 18): a sparse package gives the EXE an app identity, so App Actions can open
      # littlebirdtrading://card/us. Its Publisher must equal the signing certificate's subject, read from a probe file.
      - name: Azure login for the identity package (federated, OIDC)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Make a probe file to learn the certificate subject
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Copy-Item (Get-Command java).Source probe/probe.exe
      - name: Sign the probe
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: mlcsigning
          certificate-profile-name: mlc-public-trust
          files-folder: ${{ github.workspace }}\probe
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Pack the identity package
        shell: pwsh
        run: |
          $subject = (Get-AuthenticodeSignature probe/probe.exe).SignerCertificate.Subject
          Write-Host "publisher: $subject"
          if (-not $subject) { throw "no certificate subject" }
          $version = (Select-String -Path android/desktop/build.gradle.kts -Pattern 'APP_VERSION_NAME = "([0-9.]+)"').Matches[0].Groups[1].Value
          $src = "packaging/windows/identity"
          $xml = (Get-Content "$src/AppxManifest.xml" -Raw).Replace("PUBLISHER", [System.Security.SecurityElement]::Escape($subject)).Replace("VERSION", $version)
          New-Item -ItemType Directory -Force idpkg/Assets | Out-Null
          Set-Content -Encoding utf8 idpkg/AppxManifest.xml $xml
          Copy-Item "$src/Assets/*" idpkg/Assets/
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          New-Item -ItemType Directory -Force idmsix | Out-Null
          & $makeappx.FullName pack /d idpkg /p idmsix/lbt-identity.msix /nv /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
      - name: Sign the identity package
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: mlcsigning
          certificate-profile-name: mlc-public-trust
          files-folder: ${{ github.workspace }}\idmsix
          files-folder-filter: msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Put the identity package in the app (website build only)
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature idmsix/lbt-identity.msix
          Write-Host "identity package: $($sig.Status)"
          New-Item -ItemType Directory -Force android/desktop/native-res/windows | Out-Null
          Copy-Item idmsix/lbt-identity.msix android/desktop/native-res/windows/
      - name: Build the website installers (with self-update)
        working-directory: android
        shell: bash
        run: |
          ./gradlew --no-daemon :desktop:packageMsi :desktop:packageExe -Pdistribution=direct
          mkdir -p ../dist/direct && cp desktop/build/compose/binaries/main/msi/*.msi desktop/build/compose/binaries/main/exe/*.exe ../dist/direct/
      - name: Build the Microsoft Store installer (no self-update)
        working-directory: android
        shell: bash
        run: |
          rm -f desktop/native-res/windows/lbt-identity.msix
          ./gradlew --no-daemon :desktop:packageExe -Pdistribution=store
          mkdir -p ../dist/store && cp desktop/build/compose/binaries/main/exe/*.exe ../dist/store/
      # azure/login MUST run before the signing action (it authenticates via DefaultAzureCredential).
      - name: Azure login (federated, OIDC)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the installers (Azure Trusted Signing, Little Bird Trading LLC)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: mlcsigning
          certificate-profile-name: mlc-public-trust
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify every installer is validly signed
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem dist -Recurse -Include *.exe,*.msi) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ("${{ env.AZURE_CLIENT_ID }}" -ne "" -and $sig.Status -ne "Valid") { Write-Host "::error::$($f.Name) is not validly signed"; exit 1 }
          }
      - name: Install the MSI, run it and photograph each screen
        shell: pwsh
        run: |
          Start-Process python -ArgumentList "ci/mock/server.py","ci/mock/markets.json" -WindowStyle Hidden
          Start-Sleep 3
          $msi = Get-ChildItem dist/direct/*.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 50; throw "install failed $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Filter "Little Bird Trading.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "installed app not found" }
          Write-Host "installed at $($exe.FullName)"
          $data = "$env:APPDATA\Little Bird Trading"; New-Item -ItemType Directory -Force $data | Out-Null
          '{"welcomeDone":true,"favorites":["US","AT"]}' | Out-File -Encoding ascii "$data\settings.json"
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          foreach ($tab in "home","markets","alerts","account","levels-US","levels-AT") {
            $scene = if ($tab.StartsWith("levels-")) { "-Dlbt.market=$($tab.Substring(7))" } else { "-Dlbt.tab=$tab" }
            $env:JAVA_TOOL_OPTIONS = "-Dlbt.api=http://127.0.0.1:8787/api/app -Dlbt.favorites=US,AT $scene"
            $app = Start-Process $exe.FullName -PassThru
            Start-Sleep 25
            if ($app.HasExited) { throw "the app quit on $tab (exit $($app.ExitCode))" }
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots/$tab.png"); Stop-Process -Id $app.Id -Force; Start-Sleep 2
          }
          # Tray menu B with icons: the app opens its own tray menu after 20 seconds (LBT_SHOW_TRAY_MENU=1).
          $env:JAVA_TOOL_OPTIONS = "-Dlbt.api=http://127.0.0.1:8787/api/app"
          $env:LBT_SHOW_TRAY_MENU = "1"
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep 28
          if ($app.HasExited) { throw "the app quit before the tray menu (exit $($app.ExitCode))" }
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("shots/tray-menu.png"); Stop-Process -Id $app.Id -Force
          # Desktop voice (owner Oct 18): the app registers its identity, Ctrl+Alt+L and the voice link open the card.
          Remove-Item Env:LBT_SHOW_TRAY_MENU
          function Shot($name) { $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $bmp.Save("shots/$name.png") }
          $app = Start-Process $exe.FullName -PassThru -RedirectStandardError identity.log
          Start-Sleep 40
          Get-Content identity.log -ErrorAction SilentlyContinue | Select-String "identity|hotkey" | ForEach-Object { Write-Host $_ }
          $pkg = Get-AppxPackage -Name LittleBirdTrading.Desktop
          if ($pkg) { Write-Host "IDENTITY OK: $($pkg.PackageFullName) at $($pkg.InstallLocation)"; "ok" | Out-File identity-result.txt }
          else { Write-Host "::warning::IDENTITY NOT REGISTERED"; "missing" | Out-File identity-result.txt }
          Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public static class K { [DllImport("user32.dll")] public static extern void keybd_event(byte k, byte s, uint f, System.UIntPtr e); }'
          foreach ($k in 0x11,0x12,0x4C) { [K]::keybd_event($k,0,0,[UIntPtr]::Zero) }
          foreach ($k in 0x4C,0x12,0x11) { [K]::keybd_event($k,0,2,[UIntPtr]::Zero) }
          Start-Sleep 8; Shot "card-hotkey"
          [K]::keybd_event(0x1B,0,0,[UIntPtr]::Zero); [K]::keybd_event(0x1B,0,2,[UIntPtr]::Zero); Start-Sleep 2
          if ($pkg) { Start-Process "littlebirdtrading://card/at"; Start-Sleep 10; Shot "card-voice-link" }
          if ($app.HasExited) { throw "the app quit during the card checks (exit $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force
          if ($pkg) {
            Write-Host "App Actions registration file:"; Get-ChildItem "$($pkg.InstallLocation)" -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object { Write-Host $_.Name }
          }
          Get-ChildItem dist -Recurse -File | ForEach-Object { "{0} {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } | Tee-Object dist/SHA256SUMS.txt
      - name: Screenshots only (small, for quick checks)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-shots
          path: shots/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows
          path: |
            dist/
            shots/
            install.log
            identity.log
            identity-result.txt
  store-images:
    if: ${{ inputs.store_images == true }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out private capture source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: none298-dotcom/littlebirdtrading-app
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Capture dependencies
        run: python -m pip install Pillow pywin32 psutil
      - name: Build actual Windows store executable
        shell: bash
        working-directory: android
        run: ./gradlew --no-daemon :desktop:createDistributable -Pdistribution=store
      - name: Capture English Windows UI first
        shell: pwsh
        run: |
          $exe = Get-ChildItem android/desktop/build/compose/binaries/main/app -Recurse -Filter "Little Bird Trading.exe" | Select-Object -First 1
          if (-not $exe) { throw "Packaged Windows executable missing" }
          python tools/store-shots/capture_windows.py --exe $exe.FullName --out windows-store-shots --languages en
          if ($LASTEXITCODE -ne 0) { throw "English native capture failed" }
      - name: English captures for early visual review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-store-english
          path: |
            windows-store-shots/en/*.png
            windows-store-shots/manifest.json
      - name: Capture fourteen localized Windows sets
        shell: pwsh
        run: |
          $exe = Get-ChildItem android/desktop/build/compose/binaries/main/app -Recurse -Filter "Little Bird Trading.exe" | Select-Object -First 1
          python tools/store-shots/capture_windows.py --exe $exe.FullName --out windows-store-localized --languages de es es-MX fr hi it ja ko nl pt-BR pt-PT sv zh-Hans zh-Hant
          if ($LASTEXITCODE -ne 0) { throw "Localized native capture failed" }
      - name: Upload image evidence only, never application source
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-store-images
          path: |
            windows-store-shots/**/*.png
            windows-store-shots/manifest.json
            windows-store-shots/**/runtime.log
            windows-store-localized/**/*.png
            windows-store-localized/manifest.json
            windows-store-localized/**/runtime.log
